name: AI evals (live model)

# Calls a paid model, so it only runs when started by hand (Actions -> Run workflow).
on:
  workflow_dispatch:
    inputs:
      write_baseline:
        description: Record this run as a new baseline (download the artifact, review it, commit it)
        type: boolean
        default: false

jobs:
  live:
    name: Criteria extraction and tool choice
    runs-on: ubuntu-latest
    environment: ai-evals
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: realtron_test
          POSTGRES_USER: realtron
          POSTGRES_PASSWORD: realtronpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL:           postgres://realtron:realtronpass@localhost:5432/realtron_test
      SECRET_KEY:             ci-only-not-for-production-${{ github.run_id }}
      REDIS_URL:              redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
      ALLOWED_HOSTS:          localhost,127.0.0.1
      AI_BACKEND:             gemini
      GEMINI_API_KEY:         ${{ secrets.EVAL_GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: pip install -r requirements/base.txt
      - run: python manage.py migrate --noinput
      - name: Run live evals
        env:
          WRITE: ${{ inputs.write_baseline && '--write-baseline' || '' }}
        run: python manage.py run_ai_evals --live --provider gemini --report ai-evals-live.json $WRITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evals-live
          path: |
            ai-evals-live.json
            apps/ai/evals/baseline.json
          if-no-files-found: ignore
