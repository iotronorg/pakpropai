name: RealTron AI — CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# A newer push cancels checks still running on a branch, but never a run on main: that run may
# be deploying (each deploy also has its own non-cancelling lock in deploy.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  # ── 1. Security linters (parallel with test for speed) ──────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # trufflehog needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install Bandit
        run: pip install "bandit[toml]==1.8.*"

      - name: Bandit — static analysis (generate report)
        run: bandit -r apps/ -ll -f json -o /tmp/bandit-report.json
        continue-on-error: true  # bandit exits 1 when issues found; we gate below

      # T-6030: medium and high both fail. A false positive gets `# nosec <id> - <reason>` on its line
      # (docs/development/SECURITY_REVIEW.md §1).
      - name: Bandit — fail on MEDIUM or HIGH severity
        run: |
          python - <<'EOF'
          import json, sys
          report = json.load(open('/tmp/bandit-report.json'))
          found = [i for i in report['results'] if i['issue_severity'] in ('MEDIUM', 'HIGH')]
          if found:
              for h in found:
                  print(f"{h['issue_severity']}  {h['test_id']}  {h['filename']}:{h['line_number']}  {h['issue_text']}")
              sys.exit(1)
          print(f"Bandit: 0 medium/high issues ({len(report['results'])} total findings)")
          EOF

      - name: Dependency vulnerabilities (pip-audit)
        run: |
          pip install "pip-audit==2.*"
          pip-audit -r requirements/prod.txt --progress-spinner off

      - name: TruffleHog — secret scanning
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71  # v3.100.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── 2. Test suite + migration compatibility ──────────────────────────────
  test:
    name: Pytest + Migration Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine   # PostGIS available; GEO_POSTGIS_ENABLED stays off (T-1060b)
        env:
          POSTGRES_DB: realtron_test
          POSTGRES_USER: realtron
          POSTGRES_PASSWORD: realtronpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL:            postgres://realtron:realtronpass@localhost:5432/realtron_test
      SECRET_KEY:              ci-only-not-for-production-${{ github.run_id }}
      REDIS_URL:               redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE:  config.settings.test
      ALLOWED_HOSTS:           localhost,127.0.0.1
      DEBUG:                   "False"
      AI_BACKEND:              local
      WA_VERIFY_TOKEN:         ci-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt pytest pytest-django pytest-cov

      - name: Check for unapplied model changes
        run: python manage.py makemigrations --check --dry-run

      - name: Apply all migrations to an empty database
        run: python manage.py migrate --noinput

      - name: Generate and validate OpenAPI schema (ADR-016)
        run: python manage.py spectacular --validate --file openapi.yaml

      - name: Publish OpenAPI schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.yaml
          if-no-files-found: error

      - name: Prometheus SLO rules and alert unit tests (ADR-050)
        run: |
          docker run --rm -v "$PWD/ops:/etc/prometheus" -v "$PWD/ops/targets:/etc/prometheus/targets" -v "$PWD/ops/dev-secrets:/etc/prometheus/secrets" --entrypoint promtool prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/ops:/ops" -w /ops --entrypoint promtool prom/prometheus:v3.16.0 test rules tests/slo-rules.test.yaml
          docker run --rm -v "$PWD/ops:/ops" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /ops/alertmanager/alertmanager.yml
          echo ci-placeholder > /tmp/smtp_password
          docker run --rm -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" -v /tmp/smtp_password:/run/secrets/smtp_password:ro \
            -e ALERT_SMTP_PASSWORD_FILE=/run/secrets/smtp_password -e ALERTMANAGER_RENDER_ONLY=1 -e ALERT_EMAIL_TO=oncall@example.com -e ALERT_EMAIL_FROM=alerts@example.com \
            -e ALERT_SMTP_HOST=smtp.example.com:587 -e ALERT_SMTP_USER=alerts@example.com \
            --entrypoint /bin/sh prom/alertmanager:v0.28.1 /etc/alertmanager/start.sh > /dev/null

      - name: AI eval gate (T-2070, deterministic suites, no model call)
        run: |
          python manage.py run_ai_evals --report ai-evals.json

      - name: Archive AI eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evals
          path: ai-evals.json
          if-no-files-found: ignore

      - name: Run full test suite
        run: |
          pytest tests/ apps/ \
            -v \
            --tb=short \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml:/tmp/coverage.xml \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: /tmp/coverage.xml
          fail_ci_if_error: false

  # ── 3. Build & push Docker images (main only) ────────────────────────────
  # One build per commit; staging and production run exactly these images (tag = short sha).
  build:
    name: Build & Push Images
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.short_sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ steps.tag.outputs.short_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.short_sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:${{ steps.tag.outputs.short_sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ── 4. Staging: deployed automatically, then smoke-tested ─────────────────
  deploy-staging:
    name: Staging
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  # ── 5. Production gate: refuse to wait for approval nobody is required to give ─
  production-gate:
    name: Production approval is configured
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: The production environment requires a reviewer
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          rules=$(gh api "repos/${{ github.repository }}/environments/production" \
                    --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers | length] | add // 0') \
            || { echo "::error::Cannot read the production environment. Create it (Settings → Environments) or set ENVIRONMENTS_READ_TOKEN."; exit 1; }
          [ "$rules" -gt 0 ] || { echo "::error::The production environment has no required reviewers: production deploys need a manual approval (MVP criterion 13)."; exit 1; }
          echo "production requires approval from $rules reviewer(s)"

  # ── 6. Production: the image that passed staging, after a reviewer approves ─
  deploy-production:
    name: Production
    needs: [build, deploy-staging, production-gate]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
