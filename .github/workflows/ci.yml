name: RealTron AI — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# Cancel in-flight runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Security linters (parallel with test for speed) ──────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # trufflehog needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pakpropai/requirements/base.txt

      - name: Install Bandit
        run: pip install "bandit[toml]==1.8.*"

      - name: Bandit — static analysis (generate report)
        run: bandit -r apps/ -ll -f json -o /tmp/bandit-report.json
        working-directory: pakpropai
        continue-on-error: true  # bandit exits 1 when issues found; we gate below

      - name: Bandit — fail on HIGH severity
        run: |
          python - <<'EOF'
          import json, sys
          report = json.load(open('/tmp/bandit-report.json'))
          highs = [i for i in report['results'] if i['issue_severity'] == 'HIGH']
          if highs:
              for h in highs:
                  print(f"HIGH  {h['filename']}:{h['line_number']}  {h['issue_text']}")
              sys.exit(1)
          print(f"Bandit: 0 HIGH issues ({len(report['results'])} total findings)")
          EOF

      - name: TruffleHog — secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── 2. Test suite + migration compatibility ──────────────────────────────
  test:
    name: Pytest + Migration Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: realtron_test
          POSTGRES_USER: realtron
          POSTGRES_PASSWORD: realtronpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL:            postgres://realtron:realtronpass@localhost:5432/realtron_test
      SECRET_KEY:              ci-only-not-for-production-${{ github.run_id }}
      REDIS_URL:               redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE:  config.settings.test
      ALLOWED_HOSTS:           localhost,127.0.0.1
      DEBUG:                   "False"
      AI_BACKEND:              local
      WA_VERIFY_TOKEN:         ci-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pakpropai/requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt pytest pytest-django pytest-cov
        working-directory: pakpropai

      - name: Check for unapplied model changes
        run: python manage.py makemigrations --check --dry-run
        working-directory: pakpropai

      - name: Verify migration rollback safety (backwards compatibility)
        run: |
          python manage.py migrate --noinput
          # Roll back to zero for every app to validate down() methods compile
          python manage.py migrate --noinput users zero 2>/dev/null || true
          python manage.py migrate --noinput
        working-directory: pakpropai

      - name: Run full test suite
        run: |
          pytest tests/ apps/ \
            -v \
            --tb=short \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml:/tmp/coverage.xml \
            -x
        working-directory: pakpropai

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: /tmp/coverage.xml
          fail_ci_if_error: false

  # ── 3. Build & push Docker images (main only) ────────────────────────────
  build:
    name: Build & Push Images
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: pakpropai
          file: pakpropai/docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ steps.tag.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: pakpropai
          file: pakpropai/docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:${{ steps.tag.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ── 4. Staging deploy + automated smoke tests ────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Trigger staging deployment
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          IMAGE_TAG:   ${{ needs.build.outputs.image_tag }}
        run: |
          # Replace with your hosting platform's deploy hook.
          # Render, Railway, Coolify, and Dokku all accept a POST to a webhook URL.
          curl -fsSL -X POST "$DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -d "{\"imageTag\": \"$IMAGE_TAG\"}"

      - name: Wait for deployment to stabilize
        run: sleep 45

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke test runtime
        run: pip install requests

      - name: Run smoke tests
        env:
          STAGING_URL:           ${{ secrets.STAGING_URL }}
          SMOKE_WA_VERIFY_TOKEN: ${{ secrets.STAGING_WA_VERIFY_TOKEN }}
        run: python scripts/smoke_test.py
        working-directory: pakpropai

  # ── 3b. Push to AWS ECR (main branch only) ──────────────────────────────
  push-ecr:
    name: Push to AWS ECR
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OIDC → AWS
      contents: read

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image to ECR
        uses: docker/build-push-action@v5
        with:
          context: pakpropai
          file:    pakpropai/docker/Dockerfile.web
          push:    true
          tags: |
            ${{ secrets.ECR_API_REPO }}:${{ steps.tag.outputs.short_sha }}
            ${{ secrets.ECR_API_REPO }}:latest
          cache-from: type=gha,scope=ecr-api
          cache-to:   type=gha,mode=max,scope=ecr-api

      - name: Build & push Worker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: pakpropai
          file:    pakpropai/docker/Dockerfile.worker
          push:    true
          tags: |
            ${{ secrets.ECR_WORKER_REPO }}:${{ steps.tag.outputs.short_sha }}
            ${{ secrets.ECR_WORKER_REPO }}:latest
          cache-from: type=gha,scope=ecr-worker
          cache-to:   type=gha,mode=max,scope=ecr-worker

      - name: Build & push Frontend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: pakpropaiweb
          file:    pakpropaiweb/Dockerfile
          push:    true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.ECR_FRONTEND_REPO }}:${{ steps.tag.outputs.short_sha }}
            ${{ secrets.ECR_FRONTEND_REPO }}:latest
          cache-from: type=gha,scope=ecr-frontend
          cache-to:   type=gha,mode=max,scope=ecr-frontend

  # ── 4. Zero-downtime ECS deploy + health-check rollback ─────────────────
  deploy-prod:
    name: Deploy to Production (ECS)
    needs: push-ecr
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.FRONTEND_URL }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Run database migrations (one-off ECS task)
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --task-definition "${{ secrets.ECS_CLUSTER_NAME }}-api" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_TASKS_SG_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","manage.py","migrate","--noinput"],"environment":[{"name":"RUN_MIGRATIONS","value":"true"}]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || (echo "Migration failed"; exit 1)

      - name: Update ECS services (rolling deploy)
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
        run: |
          for SERVICE in api worker worker-hr beat frontend; do
            echo "Updating ${CLUSTER}-${SERVICE}..."
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "${CLUSTER}-${SERVICE}" \
              --force-new-deployment \
              --query 'service.serviceName' --output text
          done

      - name: Wait for API service to stabilise (up to 10 min)
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER_NAME }}" \
            --services "${{ secrets.ECS_CLUSTER_NAME }}-api" \
            --cli-read-timeout 600

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install health-check dependencies
        run: pip install requests boto3

      - name: Run post-deploy health checks (auto-rollback on failure)
        env:
          HEALTH_URL:  ${{ secrets.BASE_URL }}/health/
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          ECS_SERVICE: ${{ secrets.ECS_CLUSTER_NAME }}-api
          AWS_REGION:  ${{ secrets.AWS_REGION }}
        run: python infra/scripts/health_check.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deploy failed. ECS circuit breaker should have auto-rolled back."
          echo "Check CloudWatch: /ecs/${{ secrets.ECS_CLUSTER_NAME }}/api"
