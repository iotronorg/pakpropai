name: End-to-end journey

# MVP criterion 1 with a stand-in model and WhatsApp API: no secrets, no outside calls.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev/e2e.sh
