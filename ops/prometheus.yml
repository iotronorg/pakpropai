global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus-alerts.yaml"

scrape_configs:
  - job_name: realtron_api
    static_configs:
      # Docker Compose: "web" is the Django service name
      # Standalone (outside Docker): change to "localhost:8000"
      - targets: ["web:8000"]
    metrics_path: /metrics/
    # In production: restrict scraper IP and use basic_auth or bearer_token_file
