services:
  db:
    image: postgis/postgis:15-3.4-alpine   # PostGIS available for T-1060b (flag off by default)
    platform: linux/amd64
    environment:
      POSTGRES_DB: realtron
      POSTGRES_USER: realtron
      POSTGRES_PASSWORD: realtron
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtron -d realtron"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Allow Prometheus container to scrape /metrics/ (Docker bridge network)
      PROMETHEUS_ALLOWED_IPS: "0.0.0.0"
      PROMETHEUS_METRICS_TOKEN: dev-only-metrics-token-not-secret   # ops/dev-secrets/metrics_token
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',8000),timeout=3)\" 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build: .
    # Consume both queues in dev so all tasks are processed without a second container.
    # Prefork pool: the processes share PROMETHEUS_MULTIPROC_DIR, emptied at start (ADR-050).
    command: >
      sh -c "rm -rf /tmp/prometheus-multiproc && mkdir -p /tmp/prometheus-multiproc &&
             celery -A config worker --loglevel=info --concurrency 2 -Q default,high-resource,outbound"
    volumes:
      - .:/app
      - media_files:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      WORKER_METRICS_PORT: "9808"
    depends_on:
      web:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      web:
        condition: service_healthy

  # ── Observability (optional — comment out if not needed in dev) ───────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yaml:/etc/prometheus/prometheus-alerts.yaml:ro
      - ./ops/targets:/etc/prometheus/targets:ro
      - ./ops/dev-secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # SLO dashboards look back 30 days (ADR-050).
      - "--storage.tsdb.retention.time=35d"
    depends_on:
      - web
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  media_files:
  prometheus_data:
  grafana_data:
