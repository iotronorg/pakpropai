services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pakpropai
      POSTGRES_USER: pakprop
      POSTGRES_PASSWORD: pakprop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakprop -d pakpropai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Allow Prometheus container to scrape /metrics/ (Docker bridge network)
      PROMETHEUS_ALLOWED_IPS: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    # Consume both queues in dev so all tasks are processed without a second container.
    command: celery -A config worker --loglevel=info --concurrency 2 -Q default,high-resource
    volumes:
      - .:/app
      - media_files:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js dev server with hot reload) ────────────────────────
  frontend:
    build:
      context: ../pakpropaiweb
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../pakpropaiweb:/app
      # Named volume keeps the container's node_modules intact so the host
      # mount above doesn't overwrite the installed packages.
      - frontend_nm:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      # Required for file-watch hot reload inside Docker on Linux/WSL:
      WATCHPACK_POLLING: "true"
    depends_on:
      - web

  # ── Observability (optional — comment out if not needed in dev) ───────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yaml:/etc/prometheus/prometheus-alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  media_files:
  prometheus_data:
  grafana_data:
  frontend_nm:
