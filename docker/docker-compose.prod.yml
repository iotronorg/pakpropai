services:

  # ── Database ───────────────────────────────────────────────────────────────
  # In a managed-cloud deployment, replace this with an external DATABASE_URL
  # env var pointing at RDS / Cloud SQL and remove this service entirely.
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realtron}
      POSTGRES_USER: ${POSTGRES_USER:-realtron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realtron}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migration init job ─────────────────────────────────────────────────────
  # Runs migrations once at deploy time then exits. The web/worker containers
  # wait for this to succeed before starting.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: realtron-web:${IMAGE_TAG:-latest}
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── Regional cluster migrations (GLOBAL-7) ─────────────────────────────────
  # Only runs when EU_DATABASE_URL / UK_DATABASE_URL are set in .env.
  # If the env var is blank, Django never registers the alias and the command
  # exits 0 immediately (Django skips unknown databases).
  # These run AFTER the default migrate completes.
  migrate-eu:
    image: realtron-web:${IMAGE_TAG:-latest}
    command: >
      sh -c "[ -z \"$$EU_DATABASE_URL\" ] && echo 'EU_DATABASE_URL not set — skipping' ||
             python manage.py migrate --database eu_cluster --noinput"
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  migrate-uk:
    image: realtron-web:${IMAGE_TAG:-latest}
    command: >
      sh -c "[ -z \"$$UK_DATABASE_URL\" ] && echo 'UK_DATABASE_URL not set — skipping' ||
             python manage.py migrate --database uk_cluster --noinput"
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  # ── Django web (gunicorn) ──────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: realtron-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "2"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-eu:
        condition: service_completed_successfully
      migrate-uk:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Celery worker — default queue (notifications, scoring, billing) ─────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: realtron-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker"]
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_CONCURRENCY: "4"
      CELERY_QUEUES: "default"
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Celery worker — high-resource queue (WA processing, STT, ML) ──────────
  # WhatsApp processing, transcription, and ML tasks are routed here via
  # CELERY_TASK_ROUTES. Without this service those tasks never execute.
  worker-hr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: realtron-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker"]
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_CONCURRENCY: "2"
      CELERY_QUEUES: "high-resource"
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Celery beat scheduler ──────────────────────────────────────────────────
  beat:
    image: realtron-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["beat"]
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Frontend (Next.js standalone) ─────────────────────────────────────────
  # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
  # Set it in your .env file or pass it via the shell before running compose.
  frontend:
    build:
      context: ../../pakpropaiweb
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env, e.g. https://api.your-domain.com/api/v1}
    image: realtron-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
